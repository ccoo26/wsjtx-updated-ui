name: Release

# Publish a KF0KYL Digi release. Either:
#   - on GitHub: Actions > Release > Run workflow, enter the version (1.0.0), or
#   - push a tag:  git tag v1.0.0 && git push origin v1.0.0
# It builds Windows, Linux x86_64 and Linux ARM64 (Raspberry Pi) and creates a
# GitHub Release (and the vX.Y.Z tag) with the installers and source attached.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versions look like 1.2.3 (got $VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      release_channel: "GA"
    secrets: inherit

  linux:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: "x86_64"
      release_channel: "GA"
    secrets: inherit

  linux-arm:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: "aarch64"
      release_channel: "GA"
    secrets: inherit

  release:
    needs: [prepare, windows, linux, linux-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release files
        run: |
          shopt -s nullglob
          mkdir -p release
          git archive --format=tar.gz --prefix="kf0kyldigi-${VERSION}/" \
            -o "release/kf0kyldigi-${VERSION}-source.tar.gz" "${GITHUB_SHA}"
          for f in artifacts/kf0kyldigi-${VERSION}-windows-x86_64-installer/*.exe \
                   artifacts/kf0kyldigi-${VERSION}-linux-*-deb/*.deb \
                   artifacts/kf0kyldigi-${VERSION}-linux-*-AppImage/*.AppImage; do
            cp "$f" release/
          done
          # the Windows installer gets a clear, predictable name
          for f in release/*.exe; do
            mv "$f" "release/kf0kyldigi-${VERSION}-windows-x86_64-setup.exe"
          done
          ls -l release
          for need in "windows-x86_64-setup.exe" "linux-aarch64.deb" "linux-x86_64.AppImage"; do
            ls release/*"$need" >/dev/null 2>&1 || { echo "::error::missing $need"; exit 1; }
          done

      - name: Publish GitHub Release
        run: |
          cat > notes.md <<NOTES
          ## KF0KYL Digi ${VERSION}

          FT8, FT4 and weak-signal digital modes with a modern look, based on WSJT-X 3.0.2.

          **Downloads**
          - **Windows 10/11:** \`kf0kyldigi-${VERSION}-windows-x86_64-setup.exe\`. Windows may warn that the installer isn't signed; click *More info → Run anyway*.
          - **Raspberry Pi 4/5 (64-bit Raspberry Pi OS, Trixie):** \`kf0kyldigi-${VERSION}-linux-aarch64.deb\`, install with \`sudo apt install ./kf0kyldigi-${VERSION}-linux-aarch64.deb\`
          - **Linux PC:** the \`linux-x86_64\` AppImage or .deb

          See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) for what's new and how to set up the QRZ features.

          KF0KYL Digi is a modified version of WSJT-X and is not endorsed by the WSJT Development Team. Free software under the GNU GPL v3; source code included below.
          NOTES
          gh release create "v${VERSION}" release/* \
            --target "${GITHUB_SHA}" \
            --title "KF0KYL Digi ${VERSION}" \
            --notes-file notes.md
